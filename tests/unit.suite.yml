actor: UnitTester
bootstrap: false
modules:
    enabled:
        - \craft\test\Craft:
              configFile: 'tests/_craft/config/test.php'
              entryUrl: 'https://test.craftcms.test/index.php'
              projectConfig: []
              migrations: []
              plugins:
                  - class: justinholtweb\tidytags\Plugin
                    handle: tidytags
              cleanup: true
              transaction: true
              dbSetup:
                  clean: true
                  setupCraft: true
        - \Codeception\Module\Asserts
    step_decorators: ~
